name: Install matrix

# REAPER cannot be automated, so no Lua change and no end-to-end dub run can be
# checked here. But the thing that ACTUALLY breaks users is not the Lua — it is
# dependency installation and imports, on a Python or an OS the maintainer does
# not own. That part can be checked, on every push, for free.
#
# This exists because of two real bugs found by doing this by hand:
#   * pydub imports the stdlib `audioop`, REMOVED in Python 3.13 (PEP 594), so
#     the dubbing app was silently broken on a Python version the installers
#     actively prefer.
#   * numpy 2.5.x has no cp311 wheels, so a naive pin would have made 3.11
#     installs try to compile numpy from source and fail.
# Neither is visible from a Mac with one Python installed.

on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one broken cell must not hide the others
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg
        # Needed only for the MP3 case of the audio test; the WAV cases decode
        # through pydub's stdlib path. Tolerated if it fails so a flaky package
        # mirror cannot turn the whole matrix red — the test reports whether the
        # MP3 case actually ran.
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg || true
          else
            choco install ffmpeg -y --no-progress || true
          fi
          ffmpeg -version 2>/dev/null | head -1 || echo "ffmpeg not available"

      - name: Dubbing engine — install pinned dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dubbing/requirements.txt

      - name: Dubbing engine — self-check
        shell: bash
        working-directory: dubbing/engine
        run: python dub_engine.py --selfcheck

      - name: Dubbing engine — audio decode and region detection
        shell: bash
        run: python dubbing/engine/tests/test_audio_decode.py

      - name: Auto Sync — thin client imports on the standard library alone
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile run_sync.py sync_matcher.py app_feedback.py
          python run_sync.py --help > /dev/null
          echo "thin client OK"

      - name: Auto Sync — direct mode installs
        shell: bash
        run: |
          python -m pip install -r requirements-direct.txt
          python -c "from google import genai; import soundfile, numpy; print('direct mode OK')"

  static:
    name: syntax (lua + python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lua syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          # Every shipped ReaScript must at least parse. This is what catches
          # the 200-locals-per-chunk limit that Dub_Pipeline_Panel.lua sits on.
          luac5.4 -p auto_sync_pipeline.lua
          luac5.4 -p Sync_Item.lua scripts_optional/Sync_Item.lua
          luac5.4 -p dubbing/reaper/*.lua
          echo "lua OK"

      - name: Python syntax, all of it
        run: |
          python -m compileall -q run_sync.py sync_matcher.py app_feedback.py \
            dubbing/engine server
          echo "python OK"

      - name: Updater manifest cleanup tests
        # The only code that deletes files on a user's machine.
        run: |
          if [ -f tests/test_update_manifest.sh ]; then
            bash tests/test_update_manifest.sh
          else
            echo "manifest tests not on this branch — skipped"
          fi
